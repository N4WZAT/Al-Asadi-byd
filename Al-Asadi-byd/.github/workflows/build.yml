name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:   # تشغيل يدوي من تبويب Actions

permissions:
  contents: write      # لازم فقط لنشر الـ APK في صفحة Releases عند إنشاء tag

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # يثبّت Gradle 8.7 مباشرة، لذلك لا تحتاج إلى ملفات gradlew في المشروع
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BydVoiceAssistant-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BydVoiceAssistant-debug-apk
          path: BydVoiceAssistant-debug.apk
          if-no-files-found: error
          retention-days: 30

      # عند دفع tag مثل v1.0 يُنشر الـ APK في صفحة Releases
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BydVoiceAssistant-debug.apk
